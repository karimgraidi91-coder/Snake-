# Increase Gradle JVM and disable Jetifier to avoid JetifyTransform OOM in Codespace
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=false
org.gradle.parallel=false
org.gradle.caching=true

# Enable multidex
android.enableMultiDex=true

# Limit Gradle workers in constrained CI/container environments
org.gradle.workers.max=1

# Suppress warnings
android.suppressUnsupportedCompileSdk=31,32,33
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Disable daemon to prevent crashes in constrained CI/container environments
org.gradle.daemon=false

# Reduce Kotlin/AGP warnings for now (follow Flutter migration guidance later)
